<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>スロット</title>
  <style>
    :root{--bg:#0b1220;--card:#0f1724;--accent:#f59e0b;--muted:#94a3b8;--glass: rgba(255,255,255,0.03)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,'Noto Sans JP',sans-serif;background:linear-gradient(180deg,#071026 0%, #08122a 100%);color:#e6eef8}
    .wrap{max-width:920px;margin:36px auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .btn{background:var(--accent);border:none;color:#071026;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 12px;border-radius:10px}

    .start-screen{display:grid;gap:12px;align-items:center;justify-items:center;padding:36px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 6px 20px rgba(2,6,23,0.6)}
    .big{font-size:28px;font-weight:700}
    .small{color:var(--muted)}

    .game{display:none;margin-top:18px}
    .hud{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    .panel{background:var(--glass);padding:12px;border-radius:12px;min-width:120px;text-align:center}
    .balance{font-size:20px;font-weight:800}

    .reels{display:flex;gap:12px;justify-content:center;margin:24px 0}
    .reel{width:120px;height:120px;border-radius:14px;background:linear-gradient(180deg,#0f1724,#071224);display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:inset 0 -6px 20px rgba(0,0,0,0.5);position:relative}
    .reel .inner{transition:transform 300ms cubic-bezier(.2,.9,.3,1);}
    .controls{display:flex;gap:10px;justify-content:center}
    .spin-btn{font-size:16px;padding:12px 18px;border-radius:12px;border:none;background:#06b6d4;color:#031021;font-weight:800;cursor:pointer}
    .hint{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>スロット</h1>
      <button id="open-start" class="ghost">スタート画面</button>
    </header>

    <section id="startScreen" class="start-screen">
      <div class="big">ようこそ — 所持金 50枚 から開始</div>
      <div class="small">初期化は記録（プレイ回数・最高所持金・最大配当）をリセットします</div>
      <div style="display:flex;gap:10px">
        <button id="btnStart" class="btn">スタート</button>
        <button id="btnReset" class="ghost">初期化</button>
      </div>
    </section>

    <section id="gameArea" class="game">
      <div class="hud">
        <div class="panel"><div class="small">所持金</div><div id="balance" class="balance">0</div></div>
        <div class="panel"><div class="small">プレイ回数</div><div id="plays">0</div></div>
        <div class="panel"><div class="small">最高所持金</div><div id="bestBalance">0</div></div>
        <div class="panel"><div class="small">最大配当</div><div id="bestPayout">0</div></div>
      </div>

      <div class="reels">
        <div class="reel" id="reel0"><div class="inner">?</div></div>
        <div class="reel" id="reel1"><div class="inner">?</div></div>
        <div class="reel" id="reel2"><div class="inner">?</div></div>
      </div>

      <div class="controls">
        <button id="spinBtn" class="spin-btn">スピン</button>
        <button id="goStart" class="ghost">スタート画面へ</button>
      </div>
      <div class="hint">スピンは1回1枚。揃い方で配当が変わります。</div>
    </section>
  </div>

  <script>
    (()=>{
      const SYMBOLS=['🍒','🍊','🍋','⭐','7️⃣','💎'];
      const PAYTABLE={
        '🍒':{three:5,two:1},'🍊':{three:7,two:1},'🍋':{three:8,two:1},
        '⭐':{three:12,two:2},'7️⃣':{three:25,two:3},'💎':{three:40,two:5}
      };

      const startScreen=document.getElementById('startScreen');
      const gameArea=document.getElementById('gameArea');
      const btnStart=document.getElementById('btnStart');
      const btnReset=document.getElementById('btnReset');
      const spinBtn=document.getElementById('spinBtn');
      const goStart=document.getElementById('goStart');
      const balanceEl=document.getElementById('balance');
      const playsEl=document.getElementById('plays');
      const bestBalanceEl=document.getElementById('bestBalance');
      const bestPayoutEl=document.getElementById('bestPayout');
      const reelEls=[document.getElementById('reel0'),document.getElementById('reel1'),document.getElementById('reel2')];

      let balance=50,plays=0,bestBalance=50,bestPayout=0;
      const KEY='slot_autosave_v1';

      const save=()=>localStorage.setItem(KEY,JSON.stringify({balance,plays,bestBalance,bestPayout}));
      const load=()=>{
        const d=JSON.parse(localStorage.getItem(KEY)||'{}');
        balance=d.balance??50;plays=d.plays??0;bestBalance=d.bestBalance??50;bestPayout=d.bestPayout??0;
      };
      const reset=()=>{balance=50;plays=0;bestBalance=50;bestPayout=0;save();render();alert('初期化しました');};
      const render=()=>{balanceEl.textContent=balance;playsEl.textContent=plays;bestBalanceEl.textContent=bestBalance;bestPayoutEl.textContent=bestPayout;};

      function spin(){
        if(spinBtn.disabled)return;
        balance--;plays++;render();save();
        if(balance<=0){alert('所持金が0になりました。初期化します');reset();return;}

        spinBtn.disabled=true;
        const results=[];
        const timers=[];
        for(let i=0;i<3;i++){
          const inner=reelEls[i].querySelector('.inner');
          timers[i]=setInterval(()=>inner.textContent=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],80);
        }
        [600,900,1200].forEach((t,i)=>{
          setTimeout(()=>{
            clearInterval(timers[i]);
            const sym=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
            results[i]=sym;
            reelEls[i].querySelector('.inner').textContent=sym;
            if(i===2){
              const pay=calc(results);
              if(pay>0){balance+=pay;if(balance>bestBalance)bestBalance=balance;if(pay>bestPayout)bestPayout=pay;flash(`配当 ${pay}枚! 🎉`);}else flash('はずれ');
              render();save();spinBtn.disabled=false;
            }
          },t);
        });
      }

      const calc=(r)=>{
        if(r[0]===r[1]&&r[1]===r[2])return PAYTABLE[r[0]].three;
        if(r[0]===r[1]||r[0]===r[2])return PAYTABLE[r[0]].two||0;
        if(r[1]===r[2])return PAYTABLE[r[1]].two||0;
        return 0;
      };
      const flash=(t)=>{const e=document.createElement('div');e.textContent=t;Object.assign(e.style,{position:'fixed',top:'20%',left:'50%',transform:'translateX(-50%)',background:'#06b6d4',color:'#000',padding:'10px 14px',borderRadius:'10px',fontWeight:'700'});document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .5s';},800);setTimeout(()=>e.remove(),1300);};

      btnStart.onclick=()=>{startScreen.style.display='none';gameArea.style.display='block';render();save();};
      btnReset.onclick=()=>{if(confirm('記録を初期化しますか？'))reset();};
      goStart.onclick=()=>{gameArea.style.display='none';startScreen.style.display='grid';save();};
      document.getElementById('open-start').onclick=()=>{gameArea.style.display='none';startScreen.style.display='grid';save();};
      spinBtn.onclick=spin;

      load();render();
      window.addEventListener('beforeunload',save);
    })();
  </script>
</body>
</html>
