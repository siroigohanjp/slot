<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>スロット（段追加タイプ＋タイマー）</title>
<style>
:root{--bg:#0b1220;--card:#0f1724;--accent:#f59e0b;--muted:#94a3b8;--glass:rgba(255,255,255,0.03)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,"Segoe UI",'Noto Sans JP',sans-serif;background:linear-gradient(180deg,#071026 0%,#08122a 100%);color:#e6eef8}
.wrap{max-width:1100px;margin:36px auto;padding:20px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:20px;margin:0}
.btn{background:var(--accent);border:none;color:#071026;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 12px;border-radius:10px}
.start-screen{display:grid;gap:12px;align-items:center;justify-items:center;padding:36px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));box-shadow:0 6px 20px rgba(2,6,23,0.6)}
.big{font-size:28px;font-weight:700}
.small{color:var(--muted)}
.game{display:none;margin-top:8px}
.hud{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.panel{background:var(--glass);padding:12px;border-radius:12px;min-width:120px;text-align:center}
.balance{font-size:20px;font-weight:800}
.main-area{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.side{flex:1;min-width:200px;background:var(--glass);padding:12px;border-radius:10px}
.center{flex:2;display:flex;flex-direction:column;align-items:center}
.reels{display:grid;grid-template-columns:repeat(3,100px);gap:8px;justify-content:center;margin:12px 0}
.reel{width:100px;height:100px;border-radius:14px;background:linear-gradient(180deg,#0f1724,#071224);display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:inset 0 -6px 20px rgba(0,0,0,0.5)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spin-btn{font-size:16px;padding:12px 18px;border-radius:12px;border:none;background:#06b6d4;color:#031021;font-weight:800;cursor:pointer}
.skill{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.skill button{background:var(--accent);border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;color:#031021;margin-top:4px}
.skill .label{font-size:14px;line-height:1.4}
.hint{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
#log{font-size:13px;max-height:240px;overflow-y:auto;line-height:1.5}
#log div{border-bottom:1px solid rgba(255,255,255,0.05);padding:2px 0}
#autoTimer{font-size:13px;color:var(--muted);margin-top:4px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>スロット（段追加タイプ＋自動スピン＋ログ＋タイマー）</h1>
    <button id="open-start" class="ghost">スタート画面</button>
  </header>

  <section id="startScreen" class="start-screen">
    <div class="big">ようこそ — 所持金 50枚 から開始</div>
    <div class="small">初期化は記録（プレイ回数・最高所持金・最大配当・スキル・履歴）をリセットします</div>
    <div style="display:flex;gap:10px">
      <button id="btnStart" class="btn">スタート</button>
      <button id="btnReset" class="ghost">初期化</button>
    </div>
  </section>

  <section id="gameArea" class="game">
    <div class="hud">
      <div class="panel"><div class="small">所持金</div><div id="balance" class="balance">0</div></div>
      <div class="panel"><div class="small">プレイ回数</div><div id="plays">0</div></div>
      <div class="panel"><div class="small">最高所持金</div><div id="bestBalance">0</div></div>
      <div class="panel"><div class="small">最大配当</div><div id="bestPayout">0</div></div>
    </div>

    <div class="main-area">
      <div class="side">
        <h3>配当一覧</h3>
        <div id="payList" style="font-size:14px;line-height:1.6"></div>
        <h3>履歴ログ</h3>
        <div id="log"></div>
      </div>

      <div class="center">
        <div class="reels" id="reels"></div>
        <div class="controls">
          <button id="spinBtn" class="spin-btn">スピン</button>
          <button id="autoToggle" class="ghost">自動スピン：OFF</button>
        </div>
        <div id="autoTimer"></div>
        <div class="hint">スピンは1回1枚。各段ごとに配当判定。</div>
      </div>

      <div class="side">
        <h3>スキル</h3>
        <div id="skills"></div>
      </div>
    </div>
  </section>
</div>

<script>
(()=>{
  const SYMBOLS=['🍒','🍊','🍋','⭐','7️⃣','💎'];
  const PAYTABLE={
    '🍒':{three:5,two:1},'🍊':{three:7,two:1},'🍋':{three:8,two:1},
    '⭐':{three:12,two:2},'7️⃣':{three:25,two:3},'💎':{three:40,two:5}
  };
  const KEY='slot_stage_autosave_v1';

  const reelsEl=document.getElementById('reels');
  const spinBtn=document.getElementById('spinBtn');
  const balanceEl=document.getElementById('balance');
  const playsEl=document.getElementById('plays');
  const bestBalanceEl=document.getElementById('bestBalance');
  const bestPayoutEl=document.getElementById('bestPayout');
  const payList=document.getElementById('payList');
  const skillsEl=document.getElementById('skills');
  const btnStart=document.getElementById('btnStart');
  const btnReset=document.getElementById('btnReset');
  const logEl=document.getElementById('log');
  const autoToggle=document.getElementById('autoToggle');
  const autoTimerEl=document.getElementById('autoTimer');

  let balance=50,plays=0,bestBalance=50,bestPayout=0;
  let rows=1; // スロット段数
  let autoActive=false,countdownTimer=null,countdown=0;
  let logs=[],currentSymbols=[];
  const skills={
    autoSpin:{name:'自動スピン',level:0,cost:10,baseTime:5000},
    addReel:{name:'スロット段追加',level:0,cost:20}
  };

  const save=()=>localStorage.setItem(KEY,JSON.stringify({balance,plays,bestBalance,bestPayout,rows,skills,logs,currentSymbols}));
  const load=()=>{
    const d=JSON.parse(localStorage.getItem(KEY)||'{}');
    balance=d.balance??50;plays=d.plays??0;bestBalance=d.bestBalance??50;bestPayout=d.bestPayout??0;
    rows=d.rows??1;logs=d.logs??[];currentSymbols=d.currentSymbols??[];
    if(d.skills)Object.keys(skills).forEach(k=>Object.assign(skills[k],d.skills[k]||{}));
  };
  const reset=()=>{balance=50;plays=0;bestBalance=50;bestPayout=0;rows=1;
    skills.autoSpin.level=0;skills.autoSpin.cost=10;
    skills.addReel.level=0;skills.addReel.cost=20;
    logs=[];currentSymbols=[];save();render();alert('初期化しました');
  };

  const render=()=>{
    balanceEl.textContent=balance;
    playsEl.textContent=plays;
    bestBalanceEl.textContent=bestBalance;
    bestPayoutEl.textContent=bestPayout;
    reelsEl.innerHTML='';
    for(let r=0;r<rows;r++){
      for(let c=0;c<3;c++){
        const idx=r*3+c;
        const reel=document.createElement('div');
        reel.className='reel';
        reel.innerHTML=`<div class="inner">${currentSymbols[idx]??'?'}</div>`;
        reelsEl.appendChild(reel);
      }
    }
    payList.innerHTML='';
    for(const [sym,v] of Object.entries(PAYTABLE))
      payList.innerHTML+=`${sym}：2個=${v.two}枚 / 3個=${v.three}枚<br>`;
    skillsEl.innerHTML='';
    for(const [k,v] of Object.entries(skills)){
      let extra='';
      if(k==='autoSpin'){
        const interval=Math.max(100,v.baseTime-v.level*100);
        extra=`<br><small>間隔:${(interval/1000).toFixed(1)}s</small>`;
      }else if(k==='addReel'){
        extra=`<br><small>段数:${1+v.level}/4</small>`;
      }
      const div=document.createElement('div');
      div.className='skill';
      div.innerHTML=`
        <div class="label">${v.name} Lv.${v.level}${extra}<br><small>コスト:${v.cost}枚</small></div>
        <button ${balance<v.cost?'disabled':''}>強化</button>`;
      div.querySelector('button').onclick=()=>levelUp(k);
      skillsEl.appendChild(div);
    }
    renderLog();
    autoToggle.textContent=`自動スピン：${autoActive?'ON':'OFF'}`;
  };

  const renderLog=()=>{logEl.innerHTML=logs.map(l=>`<div>${l}</div>`).join('');};

  function spin(){
    if(spinBtn.disabled)return;
    if(balance<=0){alert('所持金が0になりました');reset();return;}
    balance--;plays++;render();save();
    spinBtn.disabled=true;

    const totalCells=rows*3;
    const results=[];
    const reels=document.querySelectorAll('.reel .inner');
    const timers=[];
    for(let i=0;i<totalCells;i++){
      timers[i]=setInterval(()=>reels[i].textContent=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],80);
    }
    const stopTimes=Array.from({length:totalCells},(_,i)=>600+i*100);
    stopTimes.forEach((t,i)=>{
      setTimeout(()=>{
        clearInterval(timers[i]);
        const sym=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
        results[i]=sym;
        reels[i].textContent=sym;
        if(i===totalCells-1){
          currentSymbols=[...results];
          const pay=calc(results);
          if(pay>0){
            balance+=pay;
            if(balance>bestBalance)bestBalance=balance;
            if(pay>bestPayout)bestPayout=pay;
            flash(`配当 ${pay}枚! 🎉`);
          }else flash('はずれ');
          logs.unshift(`${new Date().toLocaleTimeString()}｜${formatGrid(results)} → ${pay>0?pay+'枚':'なし'}`);
          if(logs.length>20)logs.pop();
          save();render();
          spinBtn.disabled=false;
          if(autoActive)startAutoCountdown();
        }
      },t);
    });
  }

  const formatGrid=(r)=>r.reduce((a,v,i)=>a+(i%3==0? (i==0?'':'｜ '):' ')+v,'');

  const calc=(r)=>{
    let total=0;
    for(let i=0;i<rows;i++){
      const row=r.slice(i*3,i*3+3);
      const counts={};
      for(const s of row)counts[s]=(counts[s]||0)+1;
      for(const [s,c] of Object.entries(counts)){
        if(c>=3)total+=PAYTABLE[s].three;
        else if(c===2)total+=PAYTABLE[s].two;
      }
    }
    return total;
  };

  const flash=(t)=>{
    const e=document.createElement('div');
    e.textContent=t;
    Object.assign(e.style,{position:'fixed',top:'20%',left:'50%',transform:'translateX(-50%)',background:'#06b6d4',color:'#000',padding:'10px 14px',borderRadius:'10px',fontWeight:'700',zIndex:1000});
    document.body.appendChild(e);
    setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .5s';},800);
    setTimeout(()=>e.remove(),1300);
  };

  function levelUp(k){
    const s=skills[k];
    if(balance<s.cost){alert('所持金が足りません');return;}
    balance-=s.cost;s.level++;s.cost*=2;
    if(k==='addReel')rows=Math.min(1+s.level,4);
    save();render();flash(`${s.name} Lv.${s.level} にアップ！`);
  }

  function startAutoCountdown(){
    clearInterval(countdownTimer);
    const interval=Math.max(100,skills.autoSpin.baseTime-skills.autoSpin.level*100);
    countdown=interval/1000;
    autoTimerEl.textContent=`次のスピンまで：${countdown.toFixed(1)}s`;
    countdownTimer=setInterval(()=>{
      countdown-=0.1;
      if(countdown<=0){
        clearInterval(countdownTimer);
        autoTimerEl.textContent='';
        spin();
      }else{
        autoTimerEl.textContent=`次のスピンまで：${countdown.toFixed(1)}s`;
      }
    },100);
  }

  function toggleAuto(){
    autoActive=!autoActive;
    clearInterval(countdownTimer);
    autoTimerEl.textContent='';
    if(autoActive && skills.autoSpin.level>0) startAutoCountdown();
    render();
  }

  // イベント
  btnStart.onclick=()=>{startScreen.style.display='none';gameArea.style.display='block';render();};
  btnReset.onclick=()=>{if(confirm('初期化しますか？'))reset();};
  document.getElementById('open-start').onclick=()=>{gameArea.style.display='none';startScreen.style.display='grid';save();};
  spinBtn.onclick=spin;
  autoToggle.onclick=toggleAuto;

  load();render();
  window.addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
