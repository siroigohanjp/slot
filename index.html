<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>スロットマシン拡張版</title>
<style>
  :root{--bg:#0b1220;--panel:#0f1724;--accent:#f59e0b;--muted:#94a3b8;--glass:rgba(255,255,255,0.03);}
  html,body{height:100%;margin:0;font-family:"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#071026,#08122a);color:#e6eef8;}
  .wrap{max-width:980px;margin:24px auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .btn{background:var(--accent);border:none;color:#071026;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
  .ghost{background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer}

  .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .panel{background:var(--glass);padding:10px;border-radius:10px;min-width:120px;text-align:center}
  .balance{font-size:20px;font-weight:800}
  
  .top-controls{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
  .spin-btn{font-size:16px;padding:12px 18px;border-radius:12px;border:none;background:#06b6d4;color:#031021;font-weight:800;cursor:pointer}
  
  .area{display:flex;gap:20px;margin-top:10px}
  .reel-area{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .row{display:flex;gap:10px;justify-content:center}
  .reel{width:100px;height:100px;border-radius:14px;background:linear-gradient(180deg,#0f1724,#071224);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:inset 0 -6px 20px rgba(0,0,0,0.5);position:relative;}
  .reel .inner{transition:transform 300ms cubic-bezier(.2,.9,.3,1);}
  
  .side{width:200px;display:flex;flex-direction:column;gap:12px}
  .panel-side{background:var(--glass);padding:10px;border-radius:10px}
  .panel-side h3{font-size:15px;margin:0 0 6px}
  .skill{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
  .skill button{font-size:12px;padding:4px 8px;border-radius:8px;border:none;background:var(--accent);color:#071026;font-weight:700;cursor:pointer}
  
  .log{position:fixed;bottom:10px;left:10px;width:260px;max-height:220px;overflow:auto;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px;font-size:13px;line-height:1.4}
  .log div{margin-bottom:4px}
  .countdown{font-size:13px;color:var(--muted);text-align:center;margin-top:-4px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>スロットマシン拡張版</h1></header>

  <div class="top-controls">
    <button id="spinBtn" class="spin-btn">🎰 スピン</button>
    <button id="autoBtn" class="ghost">自動スピン OFF</button>
  </div>
  <div class="countdown">リキャスト: <span id="autoCountdown">0.0</span> 秒</div>

  <div class="hud">
    <div class="panel"><div class="small">所持金</div><div id="balance" class="balance">0</div></div>
    <div class="panel"><div class="small">プレイ回数</div><div id="plays">0</div></div>
    <div class="panel"><div class="small">最高所持金</div><div id="bestBalance">0</div></div>
    <div class="panel"><div class="small">最大配当</div><div id="bestPayout">0</div></div>
  </div>

  <div class="area">
    <div class="side">
      <div class="panel-side">
        <h3>配当一覧</h3>
        <div>🍒 ×3 = 5 / ×2 = 1</div>
        <div>🍊 ×3 = 7 / ×2 = 1</div>
        <div>🍋 ×3 = 8 / ×2 = 1</div>
        <div>⭐ ×3 = 12 / ×2 = 2</div>
        <div>7️⃣ ×3 = 25 / ×2 = 3</div>
        <div>💎 ×3 = 40 / ×2 = 5</div>
      </div>
    </div>

    <div class="reel-area" id="reelArea"></div>

    <div class="side">
      <div class="panel-side">
        <h3>スキル</h3>
        <div class="skill">自動スピン Lv.<span id="autoLv">1</span> <button id="autoUp">強化</button></div>
        <div class="skill">スロット追加 Lv.<span id="slotLv">1</span> <button id="slotUp">強化</button></div>
      </div>
    </div>
  </div>
</div>

<div class="log" id="log"></div>

<script>
(()=>{
  const SYMBOLS=['🍒','🍊','🍋','⭐','7️⃣','💎'];
  const PAYTABLE={'🍒':{three:5,two:1},'🍊':{three:7,two:1},'🍋':{three:8,two:1},'⭐':{three:12,two:2},'7️⃣':{three:25,two:3},'💎':{three:40,two:5}};
  const reelArea=document.getElementById('reelArea');
  const balanceEl=document.getElementById('balance');
  const playsEl=document.getElementById('plays');
  const bestBalanceEl=document.getElementById('bestBalance');
  const bestPayoutEl=document.getElementById('bestPayout');
  const autoLvEl=document.getElementById('autoLv');
  const slotLvEl=document.getElementById('slotLv');
  const autoBtn=document.getElementById('autoBtn');
  const countdownEl=document.getElementById('autoCountdown');
  const logEl=document.getElementById('log');
  const spinBtn=document.getElementById('spinBtn');
  const autoUp=document.getElementById('autoUp');
  const slotUp=document.getElementById('slotUp');

  let balance=50,plays=0,bestBalance=50,bestPayout=0;
  let autoLv=1,slotLv=1;
  let autoOn=false,autoTimer=null,autoCount=0;
  const baseCostAuto=10,baseCostSlot=20;
  const KEY='slot_v5_autosave';

  function save(){localStorage.setItem(KEY,JSON.stringify({balance,plays,bestBalance,bestPayout,autoLv,slotLv}));}
  function load(){
    const d=JSON.parse(localStorage.getItem(KEY)||'{}');
    balance=d.balance??50;plays=d.plays??0;bestBalance=d.bestBalance??50;bestPayout=d.bestPayout??0;
    autoLv=d.autoLv??1;slotLv=d.slotLv??1;
  }

  function render(){
    balanceEl.textContent=balance;
    playsEl.textContent=plays;
    bestBalanceEl.textContent=bestBalance;
    bestPayoutEl.textContent=bestPayout;
    autoLvEl.textContent=autoLv;
    slotLvEl.textContent=slotLv;
  }

  function buildReels(){
    reelArea.innerHTML='';
    for(let y=0;y<slotLv;y++){
      const row=document.createElement('div');
      row.className='row';
      for(let x=0;x<3;x++){
        const r=document.createElement('div');
        r.className='reel';
        const inner=document.createElement('div');
        inner.className='inner';
        inner.textContent='?';
        r.appendChild(inner);
        row.appendChild(r);
      }
      reelArea.appendChild(row);
    }
  }

  function spin(){
    if(balance<=0){alert('所持金が0です');return;}
    spinBtn.disabled=true;
    balance--;plays++;
    const results=[];
    const rows=reelArea.querySelectorAll('.row');
    rows.forEach((row,rowIndex)=>{
      const reels=row.querySelectorAll('.reel .inner');
      reels.forEach((inner,i)=>{
        const sym=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
        inner.textContent=sym;
        results.push(sym);
      });
    });
    const pay=calc(results);
    if(pay>0){
      balance+=pay;
      if(balance>bestBalance)bestBalance=balance;
      if(pay>bestPayout)bestPayout=pay;
      addLog(`+${pay}枚 🎉`);
    }else addLog('はずれ');
    render();save();
    spinBtn.disabled=false;
  }

  function calc(res){
    let total=0;
    for(let i=0;i<res.length;i+=3){
      const r=res.slice(i,i+3);
      if(r[0]===r[1]&&r[1]===r[2])total+=PAYTABLE[r[0]].three;
      else if(r[0]===r[1]||r[1]===r[2]||r[0]===r[2]){
        const s=r[0]===r[1]?r[0]:r[1]===r[2]?r[1]:r[0];
        total+=PAYTABLE[s].two||0;
      }
    }
    return total;
  }

  function addLog(t){
    const div=document.createElement('div');
    div.textContent=`#${plays} ${t}`;
    logEl.prepend(div);
    while(logEl.children.length>50)logEl.lastChild.remove();
  }

  function startAuto(){
    if(autoOn)return;
    autoOn=true;
    autoBtn.textContent='自動スピン ON';
    autoLoop();
  }

  function stopAuto(){
    autoOn=false;
    autoBtn.textContent='自動スピン OFF';
    clearTimeout(autoTimer);
  }

  function autoLoop(){
    const delay=Math.max(0.1,5-(autoLv-1)*0.1);
    autoCount=delay;
    const tick=()=>{
      if(!autoOn)return;
      autoCount=Math.max(0,autoCount-0.1);
      countdownEl.textContent=autoCount.toFixed(1);
      if(autoCount<=0){
        spin();
        autoCount=delay;
      }
      autoTimer=setTimeout(tick,100);
    };
    tick();
  }

  autoBtn.onclick=()=>autoOn?stopAuto():startAuto();

  autoUp.onclick=()=>{
    const cost=baseCostAuto*Math.pow(2,autoLv-1);
    if(balance<cost)return alert(`強化に${cost}枚必要です`);
    balance-=cost;autoLv++;render();save();addLog(`自動スピンLv${autoLv}に強化（-${cost}枚）`);
  };

  slotUp.onclick=()=>{
    const cost=baseCostSlot*Math.pow(2,slotLv-1);
    if(balance<cost)return alert(`強化に${cost}枚必要です`);
    balance-=cost;slotLv++;buildReels();render();save();addLog(`スロットLv${slotLv}に強化（-${cost}枚）`);
  };

  spinBtn.onclick=spin;

  load();render();buildReels();
})();
</script>
</body>
</html>
