<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>スキル付きスロットマシン</title>
  <style>
    :root{--bg:#0b1220;--card:#0f1724;--accent:#f59e0b;--muted:#94a3b8;--glass: rgba(255,255,255,0.03)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,'Noto Sans JP',sans-serif;background:linear-gradient(180deg,#071026 0%, #08122a 100%);color:#e6eef8}
    .wrap{max-width:1080px;margin:36px auto;padding:20px;display:flex;gap:20px;align-items:flex-start}
    .side{flex:1;background:var(--glass);padding:14px;border-radius:12px;min-width:200px}
    .center{flex:2}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .btn{background:var(--accent);border:none;color:#071026;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 12px;border-radius:10px}
    .game{margin-top:18px}
    .hud{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
    .panel{background:var(--glass);padding:12px;border-radius:12px;min-width:120px;text-align:center}
    .balance{font-size:20px;font-weight:800}
    .reels{display:flex;gap:12px;justify-content:center;margin:24px 0;flex-wrap:wrap}
    .reel{width:100px;height:100px;border-radius:14px;background:linear-gradient(180deg,#0f1724,#071224);display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:inset 0 -6px 20px rgba(0,0,0,0.5)}
    .reel .inner{transition:transform 300ms cubic-bezier(.2,.9,.3,1);}
    .controls{display:flex;gap:10px;justify-content:center}
    .spin-btn{font-size:16px;padding:12px 18px;border-radius:12px;border:none;background:#06b6d4;color:#031021;font-weight:800;cursor:pointer}
    .hint{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
    .side h2{font-size:16px;margin-top:0;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:4px;margin-bottom:6px}
    .paytable div, .skills div{margin:4px 0;font-size:14px}
    .skill-btn{margin-top:4px;padding:6px 10px;font-size:13px;background:#06b6d4;color:#031021;border:none;border-radius:8px;cursor:pointer}
    .disabled{opacity:0.5;pointer-events:none}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 左：配当一覧 -->
    <div class="side">
      <h2>配当一覧</h2>
      <div class="paytable"></div>
    </div>

    <!-- 中央：ゲーム本体 -->
    <div class="center">
      <header>
        <h1>スキル付きスロットマシン</h1>
        <button id="btnReset" class="ghost">初期化</button>
      </header>

      <section id="gameArea" class="game">
        <div class="hud">
          <div class="panel"><div class="small">所持金</div><div id="balance" class="balance">0</div></div>
          <div class="panel"><div class="small">プレイ回数</div><div id="plays">0</div></div>
          <div class="panel"><div class="small">最高所持金</div><div id="bestBalance">0</div></div>
          <div class="panel"><div class="small">最大配当</div><div id="bestPayout">0</div></div>
        </div>

        <div class="reels" id="reels"></div>

        <div class="controls">
          <button id="spinBtn" class="spin-btn">スピン</button>
        </div>
        <div class="hint">スピンは1回1枚（スロット枠追加時は2枚）。揃い方で配当が変わります。</div>
      </section>
    </div>

    <!-- 右：スキル一覧 -->
    <div class="side">
      <h2>スキル</h2>
      <div class="skills">
        <div>
          <b>自動スピン</b> Lv.<span id="autoSpinLv">0</span><br>
          <button id="btnAutoSpin" class="skill-btn">ON/OFF</button><br>
          <button id="buyAutoSpin" class="skill-btn">レベルアップ(10枚)</button>
        </div>
        <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1)">
        <div>
          <b>スロット枠追加</b> Lv.<span id="slotExpandLv">0</span><br>
          <button id="buySlotExpand" class="skill-btn">レベルアップ(30枚)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (()=> {
    const SYMBOLS=['🍒','🍊','🍋','⭐','7️⃣','💎'];
    const PAYTABLE={
      '🍒':{three:5,two:1},'🍊':{three:7,two:1},'🍋':{three:8,two:1},
      '⭐':{three:12,two:2},'7️⃣':{three:25,two:3},'💎':{three:40,two:5}
    };
    const reelsEl=document.getElementById('reels');
    const balanceEl=document.getElementById('balance');
    const playsEl=document.getElementById('plays');
    const bestBalanceEl=document.getElementById('bestBalance');
    const bestPayoutEl=document.getElementById('bestPayout');
    const spinBtn=document.getElementById('spinBtn');
    const btnReset=document.getElementById('btnReset');
    const paytableEl=document.querySelector('.paytable');
    const autoSpinLvEl=document.getElementById('autoSpinLv');
    const slotExpandLvEl=document.getElementById('slotExpandLv');
    const buyAutoSpin=document.getElementById('buyAutoSpin');
    const buySlotExpand=document.getElementById('buySlotExpand');
    const btnAutoSpin=document.getElementById('btnAutoSpin');

    let balance=50,plays=0,bestBalance=50,bestPayout=0;
    let reelsCount=3;
    let autoSpinLv=0,slotExpandLv=0;
    let autoSpinActive=false,autoSpinTimer=null;
    const KEY='slot_autosave_v2';

    const save=()=>localStorage.setItem(KEY,JSON.stringify({balance,plays,bestBalance,bestPayout,autoSpinLv,slotExpandLv}));
    const load=()=>{
      const d=JSON.parse(localStorage.getItem(KEY)||'{}');
      balance=d.balance??50;plays=d.plays??0;bestBalance=d.bestBalance??50;bestPayout=d.bestPayout??0;
      autoSpinLv=d.autoSpinLv??0;slotExpandLv=d.slotExpandLv??0;
      reelsCount=slotExpandLv>0?5:3;
    };

    const reset=()=>{if(!confirm('初期化しますか？'))return;
      balance=50;plays=0;bestBalance=50;bestPayout=0;autoSpinLv=0;slotExpandLv=0;reelsCount=3;
      save();render();flash('初期化しました');
    };

    const render=()=>{
      balanceEl.textContent=balance;
      playsEl.textContent=plays;
      bestBalanceEl.textContent=bestBalance;
      bestPayoutEl.textContent=bestPayout;
      autoSpinLvEl.textContent=autoSpinLv;
      slotExpandLvEl.textContent=slotExpandLv;
      paytableEl.innerHTML=Object.entries(PAYTABLE).map(([k,v])=>`${k}：3個=${v.three}枚 / 2個=${v.two}枚`).join('<br>');
      renderReels();
      save();
    };

    const renderReels=()=>{
      reelsEl.innerHTML='';
      for(let i=0;i<reelsCount;i++){
        const reel=document.createElement('div');
        reel.className='reel';
        reel.innerHTML='<div class="inner">?</div>';
        reelsEl.appendChild(reel);
      }
    };

    function spin(){
      if(spinBtn.disabled)return;
      const bet=(slotExpandLv>0)?2:1;
      if(balance<bet){alert('所持金不足です');return;}
      balance-=bet;plays++;render();save();

      spinBtn.disabled=true;
      const results=[],timers=[];
      const reelEls=reelsEl.querySelectorAll('.reel');
      for(let i=0;i<reelsCount;i++){
        const inner=reelEls[i].querySelector('.inner');
        timers[i]=setInterval(()=>inner.textContent=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],80);
      }
      reelEls.forEach((_,i)=>{
        setTimeout(()=>{
          clearInterval(timers[i]);
          const sym=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
          results[i]=sym;
          reelEls[i].querySelector('.inner').textContent=sym;
          if(i===reelsCount-1){
            const pay=calc(results);
            if(pay>0){balance+=pay;if(balance>bestBalance)bestBalance=balance;if(pay>bestPayout)bestPayout=pay;flash(`配当 ${pay}枚! 🎉`);}else flash('はずれ');
            render();save();spinBtn.disabled=false;
          }
        },600+i*200);
      });
    }

    const calc=(r)=>{
      let pay=0;
      for(const sym of SYMBOLS){
        const count=r.filter(x=>x===sym).length;
        if(count>=3)pay+=PAYTABLE[sym].three;
        else if(count===2)pay+=PAYTABLE[sym].two;
      }
      return pay;
    };

    const flash=(t)=>{const e=document.createElement('div');e.textContent=t;Object.assign(e.style,{position:'fixed',top:'20%',left:'50%',transform:'translateX(-50%)',background:'#06b6d4',color:'#000',padding:'10px 14px',borderRadius:'10px',fontWeight:'700',zIndex:9999});document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .5s';},800);setTimeout(()=>e.remove(),1300);};

    // スキル購入
    buyAutoSpin.onclick=()=>{
      if(balance<10){flash('所持金不足');return;}
      balance-=10;autoSpinLv++;render();flash('自動スピンLvアップ！');
    };
    buySlotExpand.onclick=()=>{
      if(slotExpandLv>=1){flash('最大レベルです');return;}
      if(balance<30){flash('所持金不足');return;}
      balance-=30;slotExpandLv=1;reelsCount=5;render();flash('スロット枠追加！');
    };

    // 自動スピンON/OFF
    btnAutoSpin.onclick=()=>{
      if(autoSpinLv===0){flash('スキル未取得');return;}
      autoSpinActive=!autoSpinActive;
      if(autoSpinActive){
        btnAutoSpin.textContent='停止';
        autoSpinTimer=setInterval(()=>{spin();},1000);
      }else{
        btnAutoSpin.textContent='ON/OFF';
        clearInterval(autoSpinTimer);
      }
    };

    btnReset.onclick=reset;
    spinBtn.onclick=spin;

    load();render();
    window.addEventListener('beforeunload',save);
  })();
  </script>
</body>
</html>
